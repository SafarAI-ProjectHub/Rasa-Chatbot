version: "3.0"

nlu:

# -------------------------
# Welcome / Greeting
# -------------------------
- intent: welcome
  examples: |
    - مرحبًا
    - أهلاً وسهلاً
    - السلام عليكم
    - أهلاً بك
    - صباح الخير
    - مساء الخير
    - ساعدني
    - كيفك
    - مرحبا
    - شو اخبارك
    - شلونك
    - شو الاخبار
    - بدي مساعده

# -------------------------
# FAQ – Subscription
# -------------------------
- intent: faq.subscription_types
  examples: |
    - ما هي أنواع الاشتراكات؟
    - ايش الفرق بين الخطط؟
    - خطط الاشتراك
    - subscription types
    - subscription plans
    - what subscription types do you offer

# -------------------------
# FAQ – Payment
# -------------------------
- intent: faq.payment_methods
  examples: |
    - ما طرق الدفع المتاحة؟
    - هل تدعمون CliQ؟
    - طرق الدفع
    - payment options
    - how can I pay

# -------------------------
# FAQ – Placement Test
# -------------------------
- intent: faq.placement_test_info
  examples: |
    - كيف أبدأ اختبار تحديد المستوى؟
    - ايش هو اختبار المستوى؟
    - اختبار تحديد المستوى
    - what is the placement test
    - tell me about placement test

# -------------------------
# Placement – Start
# -------------------------
- intent: placement.start
  examples: |
    - ابدأ اختبار المستوى
    - اريد امتحان تحديد المستوى
    - بلش الاختبار
    - start placement test
    - begin my test

# -------------------------
# Placement – Status
# -------------------------
- intent: placement.status
  examples: |
    - وين وصلت باختبار المستوى؟
    - هل تم حفظ إجاباتي؟
    - حالة الاختبار
    - check my placement status
    - did my answers save

# -------------------------
# Discount – Apply Code
# -------------------------
- intent: discount.apply
  examples: |
    - عندي كود خصم [SAFAR10](code)
    - استخدم كود [JODFREE](code)
    - كود خصم [SAVE20](code)
    - apply discount code [PROMO50](code)
    - I have promo code [WELCOME15](code)

# -------------------------
# Discount – Availability
# -------------------------
- intent: discount.availability
  examples: |
    - هل يوجد خصومات حالياً؟
    - في عروض؟
    - عروض الاشتراك
    - are there discounts now
    - any promotions

# -------------------------
# Account – Login Help
# -------------------------
- intent: account.login_help
  examples: |
    - ما عم أقدر أسجل دخول
    - مشكلة تسجيل الدخول
    - login problem
    - I can't log in
    - trouble signing in

# -------------------------
# Account – Reset Password
# -------------------------
- intent: account.reset_password
  examples: |
    - نسيت كلمة المرور
    - reset my password
    - forgot password
    - اعادة تعيين كلمة المرور

# -------------------------
# Account – Update Profile
# -------------------------
- intent: account.update_profile
  examples: |
    - بدي اعدل الملف الشخصي
    - update my profile
    - edit my account info
    - change profile details

# -------------------------
# Support
# -------------------------
- intent: support.create_ticket
  examples: |
    - عندي مشكلة تقنية
    - افتح تذكرة دعم
    - تواصل مع الدعم
    - help me contact support
    - I need support

# -------------------------
# Chit-chat
# -------------------------
- intent: chitchat
  examples: |
    - كيف حالك؟
    - شو بتعمل؟
    - what's up
    - how are you

# -------------------------
# Goodbye
# -------------------------
- intent: goodbye
  examples: |
    - مع السلامة
    - شكراً باي
    - bye
    - goodbye
