version: '3.0'

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - welcome
  - faq.subscription_types
  - faq.payment_methods
  - faq.placement_test_info
  - placement.start
  - placement.status
  - discount.apply
  - discount.availability
  - account.login_help
  - account.reset_password
  - account.update_profile
  - support.create_ticket
  - chitchat
  - goodbye
  - nlu_fallback

entities:
  - code

slots:
  code:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: code

responses:
  utter_welcome:
    - text: "أهلاً بك في سفار AI! كيف أقدر أساعدك؟"
    - text: "Welcome to Safar AI! How can I help you?"

  utter_faq_subscription_types:
    - text: "لدينا أنواع متعددة من الاشتراكات: شهري، سنوي، ومدى الحياة."
    - text: "We offer different subscription types: monthly, yearly, and lifetime."

  utter_faq_payment_methods:
    - text: "طرق الدفع المتاحة: بطاقات بنكية، PayPal، وطرق محلية مثل CliQ (حسب البلد)."
    - text: "Payment methods include credit cards, PayPal, and local options like CliQ (where available)."

  utter_faq_placement_test_info:
    - text: "اختبار تحديد المستوى يقيس مهاراتك ويعطيك المستوى المناسب (A1-C2)."
    - text: "The placement test evaluates your skills and assigns the right level (A1–C2)."

  utter_placement_start:
    - text: "يمكنك بدء اختبار تحديد المستوى الآن من لوحة التحكم."
    - text: "You can start your placement test now from your dashboard."

  utter_placement_status:
    - text: "اختبارك قيد التقدّم. يمكنك المتابعة من لوحة التحكم."
    - text: "Your test is in progress. You can continue from your dashboard."

  utter_discount_apply:
    - text: "تم تسجيل كود الخصم: {code}"
    - text: "Your discount code {code} has been noted."

  utter_discount_availability:
    - text: "يوجد حالياً خصومات تصل إلى 20% على بعض الخطط."
    - text: "Discounts up to 20% are available on selected plans."

  utter_account_login_help:
    - text: "لتسجيل الدخول، تأكد من استخدام البريد وكلمة المرور الصحيحة. إذا واجهت مشكلة استخدم 'نسيت كلمة المرور'."

  utter_account_reset_password:
    - text: "اضغط على 'نسيت كلمة المرور' في صفحة تسجيل الدخول وسنرسل لك رابط إعادة التعيين."

  utter_account_update_profile:
    - text: "يمكنك تعديل ملفك الشخصي من صفحة 'الحساب' بعد تسجيل الدخول."

  utter_support_create_ticket:
    - text: "تم فتح تذكرة دعم، وسيقوم فريقنا بالتواصل معك قريباً."
    - text: "A support ticket has been created. Our team will contact you soon."

  utter_chitchat:
    - text: "أنا بخير، شكراً لسؤالك 😊"
    - text: "I'm doing great, thanks for asking 😊"

  utter_goodbye:
    - text: "مع السلامة! نتمنى لك تجربة ممتعة."
    - text: "Goodbye! Have a great time."

  utter_default_message:
    - text: "لم أفهم تمامًا، ممكن تعيد صياغة سؤالك؟"
    - text: "I didn’t quite get that, could you rephrase?"

actions:
  - action_push_menu
  - action_pop_menu
  - action_custom_fallback
